<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>High-scale comparison engine architecture</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f8fafc;
      --fg: #172033;
      --muted: #5b6475;
      --line: #64748b;
      --neutral: #e2e8f0;
      --input: #bfdbfe;
      --process: #c7d2fe;
      --storage: #99f6e4;
      --external: #fde68a;
      --security: #fecaca;
      --panel: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --fg: #e5e7eb;
        --muted: #a3adbd;
        --line: #94a3b8;
        --neutral: #334155;
        --input: #1d4ed8;
        --process: #4338ca;
        --storage: #0f766e;
        --external: #92400e;
        --security: #991b1b;
        --panel: #111827;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { max-width: 1280px; margin: 32px auto; padding: 0 20px 40px; }
    h1 { margin: 0; font-size: 28px; letter-spacing: -0.02em; }
    .intro { color: var(--muted); margin: 6px 0 20px; max-width: 850px; }
    .canvas { background: var(--panel); border: 1px solid var(--neutral); border-radius: 16px; padding: 12px; overflow-x: auto; }
    svg { width: 100%; min-width: 1050px; height: auto; display: block; }
    .label { font-size: 14px; font-weight: 650; fill: var(--fg); text-anchor: middle; }
    .small { font-size: 12px; fill: var(--muted); text-anchor: middle; }
    .edge-label { font-size: 11px; fill: var(--muted); text-anchor: middle; }
    .node { stroke: var(--line); stroke-width: 1.2; rx: 10; }
    .neutral { fill: var(--neutral); }
    .input { fill: var(--input); }
    .process { fill: var(--process); }
    .storage { fill: var(--storage); }
    .external { fill: var(--external); }
    .security { fill: var(--security); }
    .edge { stroke: var(--line); stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    .edge.dashed { stroke-dasharray: 5 4; }
    .zone { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 7 6; opacity: 0.75; rx: 14; }
    .zone-label { font-size: 12px; font-weight: 650; fill: var(--muted); }
    .metric { font-size: 17px; font-weight: 750; fill: var(--fg); text-anchor: middle; }
    .legend { display: flex; flex-wrap: wrap; gap: 16px; color: var(--muted); margin-top: 14px; }
    .swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; margin-right: 5px; border: 1px solid var(--line); vertical-align: -1px; }
  </style>
</head>
<body>
<main>
  <h1>High-scale comparison engine</h1>
  <p class="intro">A secure, queue-driven pipeline where folder pairs are independently retryable, workers scale horizontally, state changes are transactional, and clients receive one completion callback.</p>
  <div class="canvas">
    <svg viewBox="0 0 1240 820" role="img" aria-labelledby="diagram-title diagram-description">
      <title id="diagram-title">High-scale comparison engine AWS architecture</title>
      <desc id="diagram-description">Microsoft-authenticated requests enter through WAF and API Gateway, are queued in SQS, processed by EC2 workers using EFS, RDS, and S3, then delivered to registered callbacks through an outbox, SQS, and Lambda.</desc>
      <defs>
        <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
          <polygon points="0 0, 9 3.5, 0 7" fill="var(--line)" />
        </marker>
      </defs>

      <rect class="zone" x="220" y="70" width="990" height="700" />
      <text class="zone-label" x="240" y="94">AWS region · eu-west-1</text>
      <rect class="zone" x="230" y="310" width="700" height="250" />
      <text class="zone-label" x="250" y="334">Private application VPC · two availability zones</text>

      <!-- Connectors are drawn first so they remain behind the nodes. -->
      <path class="edge" d="M190 150 H250" />
      <path class="edge" d="M400 150 H460" />
      <path class="edge" d="M610 150 H670" />
      <path class="edge" d="M850 150 H920" />
      <path class="edge" d="M1010 195 V380 H680" />
      <path class="edge" d="M450 420 H520" />
      <path class="edge" d="M680 420 H750" />
      <path class="edge" d="M680 455 V520 H960 V440 H980" />
      <path class="edge dashed" d="M830 480 V650 H550" />
      <path class="edge" d="M710 685 H770" />
      <path class="edge dashed" d="M940 655 H980" />
      <path class="edge" d="M940 705 H1000" />
      <path class="edge dashed" d="M1080 195 V500" />
      <path class="edge dashed" d="M980 535 H940 V465 H680" />

      <text class="edge-label" x="220" y="140">SAML</text>
      <text class="edge-label" x="430" y="140">short-lived JWT</text>
      <text class="edge-label" x="640" y="140">HTTPS</text>
      <text class="edge-label" x="885" y="140">SendMessage</text>
      <text class="edge-label" x="730" y="410">job state</text>
      <text class="edge-label" x="840" y="512">JSON results</text>
      <text class="edge-label" x="690" y="643">transactional outbox</text>
      <text class="edge-label" x="970" y="675">allow-listed POST</text>

      <rect class="node external" x="40" y="105" width="150" height="90" />
      <text class="label" x="115" y="142">Microsoft Entra ID</text>
      <text class="small" x="115" y="164">AD-backed identity</text>

      <rect class="node security" x="250" y="105" width="150" height="90" />
      <text class="label" x="325" y="142">Amazon Cognito</text>
      <text class="small" x="325" y="164">SAML federation</text>

      <rect class="node external" x="460" y="105" width="150" height="90" />
      <text class="label" x="535" y="142">Go client</text>
      <text class="small" x="535" y="164">one request per pair</text>

      <rect class="node security" x="670" y="105" width="180" height="90" />
      <text class="label" x="760" y="138">WAF + API Gateway</text>
      <text class="small" x="760" y="160">JWT + schema validation</text>
      <text class="small" x="760" y="178">HTTP 202 after enqueue</text>

      <rect class="node input" x="920" y="105" width="180" height="90" />
      <text class="label" x="1010" y="138">SQS work queue</text>
      <text class="small" x="1010" y="160">at-least-once delivery</text>
      <text class="small" x="1010" y="178">DLQ after 5 receives</text>

      <rect class="node storage" x="280" y="375" width="170" height="90" />
      <text class="label" x="365" y="412">Amazon EFS</text>
      <text class="small" x="365" y="434">shared input files</text>

      <rect class="node process" x="520" y="360" width="160" height="120" />
      <text class="label" x="600" y="397">EC2 worker ASG</text>
      <text class="small" x="600" y="420">idempotent claims</text>
      <text class="small" x="600" y="440">visibility heartbeat</text>
      <text class="small" x="600" y="460">threaded file compare</text>

      <rect class="node storage" x="750" y="375" width="160" height="105" />
      <text class="label" x="830" y="408">RDS PostgreSQL</text>
      <text class="small" x="830" y="430">pair claims + status</text>
      <text class="small" x="830" y="450">transactional outbox</text>

      <rect class="node storage" x="980" y="375" width="160" height="90" />
      <text class="label" x="1060" y="412">Amazon S3</text>
      <text class="small" x="1060" y="434">immutable JSON results</text>

      <rect class="node neutral" x="980" y="500" width="160" height="70" />
      <text class="label" x="1060" y="528">CloudWatch</text>
      <text class="small" x="1060" y="549">alarms + ASG policies</text>

      <rect class="node input" x="550" y="640" width="160" height="90" />
      <text class="label" x="630" y="674">Completion SQS</text>
      <text class="small" x="630" y="696">independent callback DLQ</text>

      <rect class="node process" x="770" y="640" width="170" height="90" />
      <text class="label" x="855" y="674">Callback Lambda</text>
      <text class="small" x="855" y="696">partial batch retries</text>

      <rect class="node storage" x="980" y="610" width="160" height="70" />
      <text class="label" x="1060" y="638">DynamoDB</text>
      <text class="small" x="1060" y="659">callback allow-list</text>

      <rect class="node external" x="1000" y="700" width="180" height="70" />
      <text class="label" x="1090" y="728">Client callback</text>
      <text class="small" x="1090" y="749">job completed event</text>

      <rect class="node neutral" x="40" y="610" width="390" height="150" />
      <text class="label" x="235" y="642">Measured on the local worker path</text>
      <text class="metric" x="235" y="680">4 workers → 3.73× speedup</text>
      <text class="small" x="235" y="707">49,487 files · 378 MB generated dataset</text>
      <text class="small" x="235" y="729">93.2% parallel efficiency</text>
    </svg>
  </div>
  <div class="legend" aria-label="Diagram legend">
    <span><i class="swatch" style="background:var(--external)"></i>external</span>
    <span><i class="swatch" style="background:var(--security)"></i>security edge</span>
    <span><i class="swatch" style="background:var(--input)"></i>queue</span>
    <span><i class="swatch" style="background:var(--process)"></i>compute</span>
    <span><i class="swatch" style="background:var(--storage)"></i>durable storage</span>
    <span><i class="swatch" style="background:var(--neutral)"></i>operations</span>
  </div>
</main>
</body>
</html>
